kind = "web"
previewPath = "/"
title = "HASC Kaithal AI Assistant"
description = "A professional AI admission assistant for Hartron Advanced Skill Centre (HASC), Kaithal, helping prospective students get verified course, fee, admission, scholarship, and contact information."
version = "1.0.0"
id = "artifacts/hasc-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 22702

[services.development]
run = "pnpm --filter @workspace/hasc-assistant run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/hasc-assistant", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/hasc-assistant", "run", "serve"]

[services.production.run.env]
PORT = "22702"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "22702"
BASE_PATH = "/"
